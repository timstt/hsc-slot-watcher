[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsc-slot-watcher"
version = "0.1.0"
description = "Монітор е-черги сервісних центрів МВС: лише сповіщення в Telegram, без автозапису"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.48",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
